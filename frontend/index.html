<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账单监控站</title><link rel="stylesheet" href="/style.css"><body><header><div><small>LOCAL · READ ONLY</small><h1>账单监控站</h1></div><div id="status">连接中…</div></header><main><section class="controls"><select id="kind"><option value="month">月</option><option value="day">日</option><option value="quarter">季度</option><option value="half">半年</option><option value="year">年</option><option value="all">全部</option><option value="custom">自选</option></select><input id="value" aria-label="时间范围" placeholder="2026-09"><input id="start" type="date"><input id="end" type="date"><select id="mode"><option value="any">标签：任一</option><option value="all">标签：全部</option></select><button id="reload">更新</button></section><p id="meta"></p><section class="cards"><article><span>收入</span><strong id="income">—</strong></article><article><span>支出</span><strong id="expense">—</strong></article><article><span>净收支</span><strong id="balance">—</strong></article><article><span>筛选笔数</span><strong id="count">—</strong></article></section><section class="grid"><article><h2>每日趋势</h2><div id="trend" class="bars"></div></article><article><h2>分类钻取</h2><div id="categories"></div></article></section><section><h2>交易明细</h2><div class="table"><table><thead><tr><th>日期</th><th>方向</th><th>分类</th><th>标签</th><th>金额</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="/app.js"></script></body></html>
